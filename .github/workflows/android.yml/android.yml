<meta name="theme-color" content="#080808">  
<title>XENOR | التسويق الرقمي</title>  
<style>  
*{box-sizing:border-box}  
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}  
header{padding:24px 18px;background:#111;border-bottom:2px solid #f5c400}  
.logo{font-size:34px;font-weight:bold;color:#f5c400;letter-spacing:3px}  
header p{color:#ddd;margin-bottom:0}  
main{padding:18px;max-width:800px;margin:auto}  
.hero{padding:28px 20px;border:1px solid #393000;border-radius:16px;background:linear-gradient(135deg,#191919,#080808)}  
h1{font-size:27px;line-height:1.5}  
.gold{color:#f5c400}  
p{line-height:1.8;color:#ddd}  
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}  
.card{background:#151515;border:1px solid #333;border-radius:12px;padding:16px}  
.card h3{color:#f5c400;margin-top:0}  
a,button{display:inline-block;text-decoration:none;background:#f5c400;color:#080808;padding:12px 16px;border:0;border-radius:8px;font-weight:bold;margin:5px 0}  
.secondary{background:#222;color:#f5c400;border:1px solid #f5c400}  
footer{text-align:center;padding:24px;color:#aaa;border-top:1px solid #333}  
@media(max-width:420px){.grid{grid-template-columns:1fr}h1{font-size:23px}}  
</style>  
