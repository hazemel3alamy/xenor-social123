name = "xenor-social"
main = "worker.js"
compatibility_date = "2026-10-04"

# Create a D1 database named xenor-social-db, then replace DATABASE_ID below.
[[d1_databases]]
binding = "DB"
database_name = "xenor-social-db"
database_id = "DATABASE_ID"

# Optional but recommended for real image/video uploads.
# Create an R2 bucket named xenor-media and uncomment this block.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "xenor-media"
